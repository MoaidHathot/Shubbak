InstallationNotes: |-
  Nothing is running yet. To start the window manager at logon:

      shubbak autostart enable

  Or run it now, attached to the current terminal:

      shubbak-wm --foreground

  Configuration is searched for at $SHUBBAK_CONFIG, $XDG_CONFIG_HOME/shubbak/shubbak.kdl,
  %USERPROFILE%\.config\shubbak\shubbak.kdl and %APPDATA%\shubbak\shubbak.kdl, in that
  order. Run `shubbak config-path` to see which one is in effect.

  This build is not code signed and is installed under %LOCALAPPDATA%, so it cannot
  move windows belonging to elevated processes. Run shubbak-wm elevated if you need
  those tiled.


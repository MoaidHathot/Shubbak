# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: MoaidHathot.Shubbak
PackageVersion: 0.11.0

MinimumOSVersion: 10.0.19041.0
InstallModes:
  - silent
  - silentWithProgress
UpgradeBehavior: install
# Filled by tools/build-release.ps1 with the day the build was made.
ReleaseDate: 2026-10-17

# Four ways to install the same version: an MSI and a portable zip, each for x64 and
# for ARM64. winget picks the native architecture, prefers the MSI when both apply
# and nothing says otherwise, and falls through to the zip for `--scope user`.
#
# The MSIs are per machine, under Program Files, elevation required. They carry the
# uiAccess build of the window manager, which is what lets Shubbak move windows
# belonging to elevated processes without running elevated itself - and which
# Windows honours only for a signed binary installed in exactly that place. The
# ProductCode changes with every version and every architecture, as a major upgrade
# requires; the UpgradeCode never does, so an ARM64 machine that once installed the
# x64 MSI is upgraded to the native one. Hashes and ProductCodes are placeholders
# here, filled and checked by the release build.
#
# The zips are five standalone executables, each exposed as its own command. winget
# extracts the archive into its Packages directory and puts a symlink for every
# NestedInstallerFile into its Links directory, which is already on PATH - and that
# is what lets a bare `taj` in a config file be found. No Scope on those entries:
# winget does not support the field for portable installers and decides the scope
# from the command line instead.
Installers:
  - Architecture: x64
    InstallerType: wix
    Scope: machine
    ElevationRequirement: elevationRequired
    InstallerUrl: https://github.com/MoaidHathot/Shubbak/releases/download/v0.11.0/shubbak-0.11.0-win-x64.msi
    InstallerSha256: 6A358A5943D9A94E4D23B112664B08DCD8BD742F376449975B52DD242BEFE80E
    ProductCode: '{38401C53-0F18-44A0-820E-39E427E5E0C3}'
    Commands:
      - shubbak
    AppsAndFeaturesEntries:
      - DisplayName: Shubbak
        Publisher: Moaid Hathot
        ProductCode: '{38401C53-0F18-44A0-820E-39E427E5E0C3}'
        UpgradeCode: '{FCFFCA55-3741-45D5-9410-3429B9DF9BFD}'
        InstallerType: wix

  - Architecture: x64
    InstallerType: zip
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: shubbak.exe
        PortableCommandAlias: shubbak
      - RelativeFilePath: shubbak-wm.exe
        PortableCommandAlias: shubbak-wm
      - RelativeFilePath: taj.exe
        PortableCommandAlias: taj
      - RelativeFilePath: dalil.exe
        PortableCommandAlias: dalil
      - RelativeFilePath: ayn.exe
        PortableCommandAlias: ayn
    InstallerUrl: https://github.com/MoaidHathot/Shubbak/releases/download/v0.11.0/shubbak-0.11.0-win-x64.zip
    InstallerSha256: C6F19B9BBF392C9FDDA90457C98A41DF8365A05CC682C6F176A8AEFD97457EDC

  - Architecture: arm64
    InstallerType: wix
    Scope: machine
    ElevationRequirement: elevationRequired
    InstallerUrl: https://github.com/MoaidHathot/Shubbak/releases/download/v0.11.0/shubbak-0.11.0-win-arm64.msi
    InstallerSha256: 842A525D82676D579F5D73F4941999CEED794A2DDC99B608269F6473E323B0D8
    ProductCode: '{6D6E817D-AB35-4966-B646-2267A8C7D3B1}'
    Commands:
      - shubbak
    AppsAndFeaturesEntries:
      - DisplayName: Shubbak
        Publisher: Moaid Hathot
        ProductCode: '{6D6E817D-AB35-4966-B646-2267A8C7D3B1}'
        UpgradeCode: '{FCFFCA55-3741-45D5-9410-3429B9DF9BFD}'
        InstallerType: wix

  - Architecture: arm64
    InstallerType: zip
    NestedInstallerType: portable
    NestedInstallerFiles:
      - RelativeFilePath: shubbak.exe
        PortableCommandAlias: shubbak
      - RelativeFilePath: shubbak-wm.exe
        PortableCommandAlias: shubbak-wm
      - RelativeFilePath: taj.exe
        PortableCommandAlias: taj
      - RelativeFilePath: dalil.exe
        PortableCommandAlias: dalil
      - RelativeFilePath: ayn.exe
        PortableCommandAlias: ayn
    InstallerUrl: https://github.com/MoaidHathot/Shubbak/releases/download/v0.11.0/shubbak-0.11.0-win-arm64.zip
    InstallerSha256: F47934CCF5B4101AAF2B132169F2EE394FE870070279214D6C57CA56806B538A

ManifestType: installer
ManifestVersion: 1.12.0

# Keeps the commit-pinned actions in .github/workflows current.
#
# Every `uses:` is pinned to a commit rather than a tag, because a tag can be moved by
# whoever controls the action's repository, and two of these steps hold credentials:
# the OIDC token that signs releases and the token that opens winget-pkgs pull
# requests. A pin is only as good as its upkeep, so this opens a pull request when
# an action publishes a new version, updating the commit and the version comment
# beside it. Merging one is a review of what changed, which is the point.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One pull request for all of them, so a week of releases is one review rather
      # than one per action.
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'

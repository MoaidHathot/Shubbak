name: release

# Builds the published artefacts, signs them, and attaches them to a GitHub release.
#
# Everything downstream points here: winget and Scoop both need a stable URL and a
# SHA256, so this is the thing they consume rather than an alternative to them.
#
# Triggered by a tag rather than a push to main, because a release is a deliberate
# act and the tag is what names it. Run it by hand with workflow_dispatch to get the
# artefacts without publishing anything - that build is not required to be signed,
# a tag build is.
#
# The heavy lifting is in tools/build-release.ps1 so that a maintainer can produce
# the same zip, MSI and manifests locally before a tag exists. This file adds what
# only CI has: the credentials to sign, and the permission to publish.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # For the OpenID Connect token that azure/login exchanges for Azure credentials.
  id-token: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release:
    # NativeAOT cannot cross-compile between operating systems, so a Windows binary
    # has to be produced on Windows. This is not a preference.
    runs-on: windows-latest

    # The environment is what gives the OIDC token a stable subject -
    # repo:<owner>/<repo>:environment:release - which is what the federated credential
    # in Entra is configured to trust. A tag-based subject would need a new credential
    # per release. See RELEASING.md for the setup.
    environment: release

    env:
      # Secrets cannot be tested in `if:` directly, so their presence is computed once
      # here. All six are needed to sign; RELEASING.md lists what each one is.
      SIGNING_ENABLED: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_TENANT_ID != '' && secrets.AZURE_SUBSCRIPTION_ID != '' && vars.SIGNING_ENDPOINT != '' && vars.SIGNING_ACCOUNT != '' && vars.SIGNING_CERTIFICATE_PROFILE != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The version the binaries will report comes from Directory.Build.props, and the
      # tag is written by a human at a different moment. When they disagree, the
      # release is named one thing and contains another - and the only place that ever
      # surfaces is a bug report six months later quoting a version that was never
      # released. So they are compared before anything is built, along with everything
      # else that carries the version: the manifests, the changelog, the readme.
      - name: Check the tag against the version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()

          if (-not $version) { throw "Directory.Build.props has no <Version>." }

          Write-Output "Directory.Build.props: $version"

          if ($env:IS_TAG -eq 'true') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            Write-Output "tag: $tag"

            if ($tag -ne "v$version") {
              throw "Tag '$tag' does not match <Version> '$version'. Expected 'v$version'. " +
                    "Either retag or update Directory.Build.props."
            }

            ./tools/check-release-consistency.ps1 -ForRelease
          }
          else {
            Write-Output "Not a tag build; skipping the tag comparison."
            ./tools/check-release-consistency.ps1
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      # A release is signed or it does not happen. An unsigned build from a tag would
      # be published under the same name as the signed one that should have existed,
      # and the uiAccess window manager inside the MSI would not even start.
      - name: Refuse to release unsigned
        if: env.IS_TAG == 'true' && env.SIGNING_ENABLED != 'true'
        shell: pwsh
        run: |
          throw "This is a tag build but code signing is not configured. " +
                "Set the AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID secrets and the " +
                "SIGNING_ENDPOINT, SIGNING_ACCOUNT and SIGNING_CERTIFICATE_PROFILE variables on the " +
                "'release' environment. See RELEASING.md."

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is on, so this is the lint step too. A release must never
      # be the first build that discovers something.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity quiet

      # Five portable executables plus the uiAccess window manager, for x64 and for
      # ARM64, each checked: the right machine type, the right subsystem, the right
      # manifest, and the right reported version where this runner can run it. The
      # ARM64 binaries are cross-compiled and cannot run here; build.yml runs them on
      # an ARM64 runner on every push, which is why a release does not have to.
      - name: Publish (NativeAOT)
        shell: pwsh
        run: ./tools/build-release.ps1 -Publish -SkipTests

      - name: Log in to Azure
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Every executable, before it is packed into anything. Artifact Signing
      # certificates live for three days, so the timestamp is what keeps the
      # signature valid after that; the timestamp server is the service's own.
      - name: Sign the executables
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signatures on the executables
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: ./tools/check-signatures.ps1 (Get-ChildItem artifacts/publish, artifacts/publish-uiaccess -Recurse -Filter *.exe).FullName

      # The zips are packed from the signed binaries, and the MSIs are built from them,
      # so all of them contain exactly what was checked above. ICE validation runs on
      # the x64 MSI; Windows Installer on this runner cannot open the ARM64 one, and the
      # authoring is the same.
      - name: Stage and pack
        shell: pwsh
        run: ./tools/build-release.ps1 -Stage -Pack

      # The MSIs themselves, as files. Only the copies at the top of artifacts/, which
      # are the ones that ship; the build output under artifacts/msi is not recursed
      # into.
      - name: Sign the MSIs
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts
          files-folder-filter: msi
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signatures on the MSIs
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: ./tools/check-signatures.ps1 (Get-ChildItem artifacts -Filter *.msi).FullName

      # Hashes are taken last, after signing, because signing changes the files. The
      # winget and Scoop manifests are filled from them and validated with the real
      # winget client, which the runner image ships.
      - name: Hash the packages and fill the manifests
        id: manifests
        shell: pwsh
        run: |
          ./tools/ensure-winget.ps1
          ./tools/build-release.ps1 -Manifests

      - name: Upload the build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: shubbak-${{ steps.version.outputs.version }}
          path: |
            artifacts/shubbak-*.zip
            artifacts/shubbak-*.msi
            artifacts/shubbak-*.sha256
            artifacts/SHA256SUMS.txt
            artifacts/winget/
            artifacts/bucket/
          if-no-files-found: error

      # A draft, on purpose. Read the generated notes, check the artefacts, then publish
      # by hand. Publishing is what triggers the winget and Scoop update workflow.
      - name: Publish the release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/shubbak-*.zip
            artifacts/shubbak-*.msi
            artifacts/shubbak-*.sha256
            artifacts/SHA256SUMS.txt
          body: |
            ## Install

            ```
            winget install MoaidHathot.Shubbak
            ```

            That installs the MSI to `Program Files`, which is what lets Shubbak tile windows
            that belong to elevated processes without running elevated itself. winget picks
            the build for your machine: x64, or native ARM64. For a portable install under
            your own profile, with no administrator prompt:

            ```
            winget install MoaidHathot.Shubbak --scope user
            ```

            ```
            scoop bucket add shubbak https://github.com/${{ github.repository }}
            scoop install shubbak
            ```

            Or download the zip below, unpack it anywhere, and:

            ```
            shubbak config init
            shubbak-wm --foreground
            ```

            Then `shubbak autostart enable` once you want it at logon. The
            [getting started guide](https://github.com/${{ github.repository }}/blob/v${{ steps.version.outputs.version }}/docs/getting-started.md)
            has the rest.

            `SHA256`:

            ```
            ${{ steps.manifests.outputs.sha256sums }}
            ```

            Every executable and the MSI are Authenticode signed. The certificate is new,
            so SmartScreen may still warn the first time you run something downloaded by
            hand until it has seen enough installs; `winget` installs are not affected.

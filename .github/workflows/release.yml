name: release

# Builds the published artefacts and attaches them to a GitHub release.
#
# Everything downstream points here: winget and Scoop both need a stable URL and a
# SHA256, so this is the thing they consume rather than an alternative to them.
#
# Triggered by a tag rather than a push to main, because a release is a deliberate
# act and the tag is what names it. Run it by hand first with workflow_dispatch if you
# want the artefacts without publishing anything.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Attach the artefacts to a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  release:
    # NativeAOT cannot cross-compile between operating systems, so a Windows binary
    # has to be produced on Windows. This is not a preference.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The version the binaries will report comes from Directory.Build.props, and the
      # tag is written by a human at a different moment. When they disagree, the
      # release is named one thing and contains another - and the only place that ever
      # surfaces is a bug report six months later quoting a version that was never
      # released. So they are compared before anything is built.
      - name: Check the tag against the version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $version = $props.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1

          if (-not $version) { throw "Directory.Build.props has no <Version>." }

          Write-Output "Directory.Build.props: $version"

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
            Write-Output "tag: $tag"

            if ($tag -ne "v$version") {
              throw "Tag '$tag' does not match <Version> '$version'. Expected 'v$version'. " +
                    "Either retag or update Directory.Build.props."
            }
          }
          else {
            Write-Output "Not a tag build; skipping the tag comparison."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is on, so this is the lint step too. A release must never
      # be the first build that discovers something.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity quiet

      # Each binary publishes to its own directory. They share none, deliberately:
      # Shubbak.Wm bakes its manifest into the apphost and MSBuild does not treat
      # ShubbakUiAccess as an input to it, so a shared output directory is how a
      # uiAccess apphost survives into a build that did not ask for one - producing a
      # binary that cannot start, with nothing in the log to say why.
      - name: Publish (NativeAOT)
        shell: pwsh
        run: |
          foreach ($project in 'Shubbak.Wm', 'Shubbak.Cli', 'Taj', 'Dalil') {
            Write-Output "::group::publish $project"
            dotnet publish "src/$project" `
              --configuration Release `
              --runtime win-x64 `
              -p:PublishAot=true `
              --output "artifacts/publish/$project"
            if ($LASTEXITCODE -ne 0) { throw "publish failed for $project" }
            Write-Output "::endgroup::"
          }

      # A published binary that cannot answer --version is one nobody can identify in a
      # bug report, and it is the cheapest possible end-to-end check that AOT produced
      # something that actually runs. Every one of them is asked.
      - name: Check the binaries run and agree on the version
        shell: pwsh
        run: |
          $expected = "Shubbak ${{ steps.version.outputs.version }}"
          $binaries = @{
            'shubbak-wm' = 'artifacts/publish/Shubbak.Wm/shubbak-wm.exe'
            'shubbak'    = 'artifacts/publish/Shubbak.Cli/shubbak.exe'
            'taj'        = 'artifacts/publish/Taj/taj.exe'
            'dalil'      = 'artifacts/publish/Dalil/dalil.exe'
          }

          foreach ($name in $binaries.Keys) {
            $exe = $binaries[$name]
            if (-not (Test-Path $exe)) { throw "$name did not publish to $exe" }

            # Redirected rather than run inline: three of the four are GUI-subsystem
            # binaries, so the shell does not wait for them and their output would
            # arrive after this step had already moved on.
            $out = New-TemporaryFile
            $p = Start-Process -FilePath $exe -ArgumentList '--version' `
                   -RedirectStandardOutput $out -NoNewWindow -Wait -PassThru

            $reported = (Get-Content $out -Raw).Trim()
            Remove-Item $out -Force

            if ($p.ExitCode -ne 0) { throw "$name --version exited $($p.ExitCode)" }
            if ($reported -ne $expected) {
              throw "$name reports '$reported'; expected '$expected'."
            }

            Write-Output "$name -> $reported"
          }

      - name: Stage the package
        id: stage
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $stage = 'artifacts/stage'
          $symbols = 'artifacts/symbols'

          New-Item -ItemType Directory -Path $stage, $symbols -Force | Out-Null

          # Only the executables. NativeAOT emits a .pdb roughly four times the size of
          # the binary it describes, plus an XML doc file per referenced project from
          # GenerateDocumentationFile - together about 90% of the publish directory and
          # none of it any use to somebody running a window manager.
          foreach ($project in 'Shubbak.Wm', 'Shubbak.Cli', 'Taj', 'Dalil') {
            Copy-Item "artifacts/publish/$project/*.exe" $stage
            Copy-Item "artifacts/publish/$project/*.pdb" $symbols -ErrorAction SilentlyContinue
          }

          # What someone needs in front of them the first time they run it.
          Copy-Item LICENSE $stage
          Copy-Item README.md $stage
          Copy-Item docs/shubbak.example.kdl $stage

          $flat = Get-ChildItem $stage -File | Select-Object -ExpandProperty Name
          Write-Output "package contents: $($flat -join ', ')"

          # Flat, with no directory prefix. Both winget's NestedInstallerFiles and
          # Scoop's bin array name paths inside the archive, and a version-stamped
          # top-level folder would have to be edited into both on every release.
          $zip = "artifacts/shubbak-$version-win-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

          $symbolZip = "artifacts/shubbak-$version-win-x64-symbols.zip"
          Compress-Archive -Path "$symbols/*" -DestinationPath $symbolZip -Force

          # winget will not accept a manifest without one, and it is what tells anyone
          # downloading by hand that they got what this workflow built.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          Set-Content "$zip.sha256" "$hash  shubbak-$version-win-x64.zip"

          Write-Output "sha256: $hash"
          Write-Output ("size:   {0:N2} MB" -f ((Get-Item $zip).Length / 1MB))

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload the build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: shubbak-${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/shubbak-*.zip
            artifacts/shubbak-*.sha256
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/shubbak-*.zip
            artifacts/shubbak-*.sha256
          body: |
            ## Install

            ```
            winget install MoaidHathot.Shubbak
            ```

            ```
            scoop bucket add shubbak https://github.com/${{ github.repository }}
            scoop install shubbak
            ```

            Or download the zip below, unpack it anywhere, and:

            ```
            shubbak autostart enable
            shubbak-wm
            ```

            `SHA256` of the zip:

            ```
            ${{ steps.stage.outputs.sha256 }}
            ```

            > This build is **not code signed**. SmartScreen will warn on first run,
            > and `shubbak-wm` cannot move windows belonging to elevated processes
            > unless you run it elevated. See the README for what that costs and why.

name: build

# Runs on every push and pull request.
#
# This exists because a test project was once left out of the solution file and
# nothing noticed for a week - the tests in it were the ones guarding the path where
# a mistake leaves the keyboard unusable. Building and testing the solution is the
# cheapest thing that would have caught it, on the commit that introduced it.
#
# It also does everything the release workflow does except sign and publish, for the
# same reason: a release must never be the build that discovers something. Until that
# was true the readme claimed "single NativeAOT executables" on the strength of a
# spike, and the binaries that actually shipped had never been AOT compiled in CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    # Windows, and not by preference: the platform layer is Win32 and the tests
    # create real windows to check what Shubbak does to them.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Everything that carries the version - the application manifests, the winget and
      # Scoop manifests and their URLs, the MSI's UpgradeCode - is compared against
      # Directory.Build.props. Each has been wrong at least once when a person did it.
      - name: Check that every copy of the version agrees
        shell: pwsh
        run: ./tools/check-release-consistency.ps1

      # The manifests are templates with placeholder hashes, but everything else in
      # them - schema, fields, values - is what will be submitted, and the real client
      # is the only validator that matters.
      - name: Validate the winget manifests
        shell: pwsh
        run: |
          ./tools/ensure-winget.ps1
          winget validate --manifest packaging/winget

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is already on, so this is the lint step as well.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The whole solution, deliberately, rather than a list of projects that can
      # drift out of date - which is the failure this workflow is here to prevent.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity quiet

      # Cheap check that the shipped example stays loadable, since it is what
      # everyone starts from.
      - name: Validate the example config
        run: dotnet run --project src/Shubbak.Cli --configuration Release --no-build -- check-config docs/shubbak.example.kdl

      # The documentation shows configuration, and configuration rots. Every KDL block
      # in the readme and the docs is loaded through the real parser, and a warning
      # fails the build: the first snippet a newcomer copies must not be one the
      # parser then complains about. Before the release build, which replaces the
      # managed CLI in bin with nothing - a NativeAOT publish has no apphost to leave.
      - name: Check the documentation's config snippets
        shell: pwsh
        run: ./tools/check-doc-snippets.ps1

      # The release, unsigned: publishes the five executables and the uiAccess window
      # manager and checks each (version reported, PE subsystem, embedded manifest),
      # packs the zip, builds the MSI with ICE validation, hashes, and fills and
      # validates the package manifests. The same script the release workflow runs,
      # so the two cannot disagree about what a release is.
      - name: Build the release artefacts
        shell: pwsh
        run: ./tools/build-release.ps1 -SkipTests

      # The architecture page quotes a test count in two places. It has been corrected
      # by hand four times and was wrong on each of the four occasions somebody looked -
      # the last time within the same commit that added this check, because the count
      # was taken before the last test file was written. So it is checked rather than
      # remembered.
      - name: Check the documented test count
        shell: pwsh
        run: |
          # Recursive: a test in a nested folder would otherwise be invisible to the
          # very check that exists to notice drift.
          $files = Get-ChildItem -Path tests -Recurse -Filter *.cs -File |
              Where-Object { $_.FullName -notmatch '\\obj\\|\\bin\\' }

          $declared = ($files | Select-String -Pattern '^\s*\[(Fact|Theory)' -AllMatches).Count

          $claimed = (Select-String -Path docs/architecture.md -Pattern '(\d+) test methods' -AllMatches).Matches |
              ForEach-Object { [int]$_.Groups[1].Value } | Sort-Object -Unique

          if ($claimed.Count -eq 0) { throw "docs/architecture.md no longer states a test count; remove this check or restore the figure." }

          foreach ($n in $claimed) {
            if ($n -ne $declared) {
              throw "docs/architecture.md says $n test methods; the tree declares $declared. Update it."
            }
          }

          Write-Output "Documented test count is correct: $declared"

      # Unsigned, so not for anybody else - but exactly what a release would contain,
      # which makes it the thing to install on a test machine before tagging.
      - name: Upload the unsigned artefacts
        uses: actions/upload-artifact@v4
        with:
          name: shubbak-unsigned-${{ github.sha }}
          path: |
            artifacts/shubbak-*.zip
            artifacts/shubbak-*.msi
            artifacts/shubbak-*.sha256
            artifacts/winget/
            artifacts/bucket/
          retention-days: 7
          if-no-files-found: error

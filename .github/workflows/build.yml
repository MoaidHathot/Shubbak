name: build

# Runs on every push and pull request.
#
# This exists because a test project was once left out of the solution file and
# nothing noticed for a week - the tests in it were the ones guarding the path where
# a mistake leaves the keyboard unusable. Building and testing the solution is the
# cheapest thing that would have caught it, on the commit that introduced it.
#
# It also does everything the release workflow does except sign and publish, for the
# same reason: a release must never be the build that discovers something. Until that
# was true the readme claimed "single NativeAOT executables" on the strength of a
# spike, and the binaries that actually shipped had never been AOT compiled in CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, so the workflow token is read-only - stated
# here rather than left to the repository's default setting, since one step hands the
# token to code fetched at run time (see the winget step) and what that code could do
# with it should not depend on a setting somebody may one day flip.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    # Windows, and not by preference: the platform layer is Win32 and the tests
    # create real windows to check what Shubbak does to them. x64, and it also
    # cross-compiles the ARM64 release below; the ARM64 job then runs what it built.
    runs-on: windows-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          "version=$($props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim())" >> $env:GITHUB_OUTPUT

      # Everything that carries the version - the application manifests, the winget and
      # Scoop manifests and their URLs, the MSI's UpgradeCode - is compared against
      # Directory.Build.props. Each has been wrong at least once when a person did it.
      - name: Check that every copy of the version agrees
        shell: pwsh
        run: ./tools/check-release-consistency.ps1

      # The manifests are templates with placeholder hashes, but everything else in
      # them - schema, fields, values - is what will be submitted, and the real client
      # is the only validator that matters.
      #
      # GH_TOKEN: updating the client goes through GitHub's API, which the WinGet
      # module calls anonymously unless a token is in the environment - and anonymous
      # calls share a rate limit with everything else on the runner's address. One
      # run failed on exactly that, while the same step had passed on every earlier
      # run. The token is read-only (permissions, above) and the module wants nothing
      # more of it: it sends it to api.github.com alone, and downloads the client's
      # packages without it.
      - name: Validate the winget manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/ensure-winget.ps1
          winget validate --manifest packaging/winget

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is already on, so this is the lint step as well.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The whole solution, deliberately, rather than a list of projects that can
      # drift out of date - which is the failure this workflow is here to prevent.
      #
      # The console logger is named because --verbosity quiet otherwise quiets it too,
      # and at quiet it prints a failing test's name and nothing else - not the
      # assertion, not the exception, not the line. A test that failed one run in ten
      # on the ARM64 runner was undiagnosable from its own log for exactly that reason.
      # Minimal prints the failures in full and stays silent about the passes.
      # With coverage, collected by coverlet into one Cobertura file per test project
      # and uploaded as an artefact. Not gated: the figure exists to be looked at when
      # deciding where the next test belongs, and a threshold that fails the build
      # over a refactor's percentage point teaches people to write tests that hit
      # lines rather than tests that hold behaviour to account. The companions' hosts
      # had no tests at all for their first year, and nothing said so.
      - name: Test
        run: >
          dotnet test --no-build --configuration Release --verbosity quiet
          --logger "console;verbosity=minimal"
          --collect:"XPlat Code Coverage"
          --results-directory artifacts/coverage

      - name: Summarise coverage
        shell: pwsh
        run: ./tools/summarise-coverage.ps1 -Root artifacts/coverage

      - name: Upload the coverage reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.sha }}
          path: artifacts/coverage/**/coverage.cobertura.xml
          retention-days: 14
          if-no-files-found: warn

      # Cheap check that the shipped example stays loadable, since it is what
      # everyone starts from.
      - name: Validate the example config
        run: dotnet run --project src/Shubbak.Cli --configuration Release --no-build -- check-config docs/shubbak.example.kdl

      # The documentation shows configuration, and configuration rots. Every KDL block
      # in the readme and the docs is loaded through the real parser, and a warning
      # fails the build: the first snippet a newcomer copies must not be one the
      # parser then complains about. Before the release build, which replaces the
      # managed CLI in bin with nothing - a NativeAOT publish has no apphost to leave.
      - name: Check the documentation's config snippets
        shell: pwsh
        run: ./tools/check-doc-snippets.ps1

      # The architecture page quotes a test count in two places. It has been corrected
      # by hand four times and was wrong on each of the four occasions somebody looked -
      # the last time within the same commit that added this check, because the count
      # was taken before the last test file was written. So it is checked rather than
      # remembered.
      - name: Check the documented test count
        shell: pwsh
        run: |
          # Recursive: a test in a nested folder would otherwise be invisible to the
          # very check that exists to notice drift.
          $files = Get-ChildItem -Path tests -Recurse -Filter *.cs -File |
              Where-Object { $_.FullName -notmatch '\\obj\\|\\bin\\' }

          $declared = ($files | Select-String -Pattern '^\s*\[(Fact|Theory)' -AllMatches).Count

          $claimed = (Select-String -Path docs/architecture.md -Pattern '(\d+) test methods' -AllMatches).Matches |
              ForEach-Object { [int]$_.Groups[1].Value } | Sort-Object -Unique

          if ($claimed.Count -eq 0) { throw "docs/architecture.md no longer states a test count; remove this check or restore the figure." }

          foreach ($n in $claimed) {
            if ($n -ne $declared) {
              throw "docs/architecture.md says $n test methods; the tree declares $declared. Update it."
            }
          }

          Write-Output "Documented test count is correct: $declared"

      # The diagnostics catalogue is generated from the source, and a page that is
      # generated once and then left drifts the first time somebody adds a code and
      # forgets the script. Regenerated here and compared; a difference names the fix.
      - name: Check the diagnostics catalogue is current
        shell: pwsh
        run: |
          ./tools/list-diagnostics.ps1 | Out-Null

          $drift = git diff --name-only -- docs/diagnostics.md

          if ($drift) {
            git --no-pager diff -- docs/diagnostics.md
            throw "docs/diagnostics.md is out of date; run tools/list-diagnostics.ps1 and commit the result."
          }

          Write-Output "Diagnostics catalogue is current"

      # The release, unsigned, for both architectures: publishes the five executables
      # and the uiAccess window manager for each and checks them (machine type, PE
      # subsystem, embedded manifest, and the reported version where this machine can
      # run them), packs the zips, builds the MSIs - the x64 one with ICE validation -
      # hashes, and fills and validates the package manifests. The same script the
      # release workflow runs, so the two cannot disagree about what a release is.
      - name: Build the release artefacts
        shell: pwsh
        run: ./tools/build-release.ps1 -SkipTests

      # Install it, check everything it claims to put on the machine, uninstall it,
      # check it is all gone. The runner is elevated and disposable, which is exactly
      # what an installer test wants. The window manager inside is the uiAccess build
      # and is not started; it would refuse to, unsigned.
      - name: Install and uninstall the x64 MSI
        shell: pwsh
        run: ./tools/test-msi.ps1 -Path artifacts/shubbak-${{ steps.version.outputs.version }}-win-x64.msi -Version ${{ steps.version.outputs.version }}

      # Unsigned, so not for anybody else - but exactly what a release would contain,
      # which makes it the thing to install on a test machine before tagging. Also
      # what the ARM64 job below picks up.
      - name: Upload the unsigned artefacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shubbak-unsigned-${{ github.sha }}
          path: |
            artifacts/shubbak-*.zip
            artifacts/shubbak-*.msi
            artifacts/shubbak-*.sha256
            artifacts/SHA256SUMS.txt
            artifacts/winget/
            artifacts/bucket/
          retention-days: 7
          if-no-files-found: error

  arm64:
    # The ARM64 binaries are cross-compiled above; this is where they run. Two things
    # happen here that cannot happen on x64: the tests run natively, so the platform
    # layer is exercised on the architecture people will actually use it on, and the
    # ARM64 MSI is installed and uninstalled for real - which stands in for the ICE
    # validation an x64 machine cannot perform on it.
    runs-on: windows-11-arm
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # ShubbakRid is the architecture the executables, the test hosts and the one
      # architecture-specific library are built for; see Directory.Build.props. The SDK
      # refuses a RuntimeIdentifier at the solution level (NETSDK1134), which is why it
      # is a property of its own.
      - name: Restore
        run: dotnet restore -p:ShubbakRid=win-arm64

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:ShubbakRid=win-arm64

      # Natively: the test hosts are ARM64 processes loading ARM64-compiled Win32
      # bindings, so the platform layer is exercised on the architecture people will
      # run it on rather than through emulation.
      #
      # Less the tests that must take the foreground to measure anything - the focus
      # sink's, which ask which window Windows hands the foreground to. This image comes
      # up with a "Microsoft account" sign-in surface (a Windows.UI.Core.CoreWindow in
      # WWAHost) in front, which refuses AttachThreadInput and is not moved by an
      # injected input event either, so every one of them failed at its first step for
      # a reason that has nothing to do with the code. The x64 job runs them all; the
      # behaviour they pin is Windows', not the architecture's. Diagnosed from the
      # assertion message, which names the window in front for exactly this purpose.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity quiet --logger "console;verbosity=minimal" -p:ShubbakRid=win-arm64 --filter "Requires!=Foreground"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shubbak-unsigned-${{ github.sha }}
          path: artifacts

      # The five cross-compiled executables, run on the machine they were built for.
      - name: Run the ARM64 binaries
        shell: pwsh
        run: |
          $version = '${{ needs.build.outputs.version }}'
          $dir = 'artifacts/unpacked-arm64'
          Expand-Archive "artifacts/shubbak-$version-win-arm64.zip" -DestinationPath $dir -Force

          foreach ($name in 'shubbak', 'shubbak-wm', 'taj', 'dalil', 'ayn') {
            $exe = Join-Path $dir "$name.exe"
            $bytes = [System.IO.File]::ReadAllBytes($exe)
            $pe = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
            if ($machine -ne 0xAA64) { throw ("{0}.exe has machine type 0x{1:X4}; expected ARM64 (0xAA64)." -f $name, $machine) }

            $out = New-TemporaryFile
            $p = Start-Process -FilePath $exe -ArgumentList '--version' -RedirectStandardOutput $out -NoNewWindow -Wait -PassThru
            $reported = (Get-Content $out -Raw).Trim()
            Remove-Item $out -Force
            if ($p.ExitCode -ne 0) { throw "$name --version exited $($p.ExitCode)." }
            if ($reported -ne "Shubbak $version") { throw "$name reports '$reported'; expected 'Shubbak $version'." }
            Write-Output "$name.exe -> $reported (ARM64)"
          }

      - name: Install and uninstall the ARM64 MSI
        shell: pwsh
        run: ./tools/test-msi.ps1 -Path artifacts/shubbak-${{ needs.build.outputs.version }}-win-arm64.msi -Version ${{ needs.build.outputs.version }}

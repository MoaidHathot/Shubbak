name: build

# Runs on every push and pull request.
#
# This exists because a test project was once left out of the solution file and
# nothing noticed for a week - the tests in it were the ones guarding the path where
# a mistake leaves the keyboard unusable. Building and testing the solution is the
# cheapest thing that would have caught it, on the commit that introduced it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Windows, and not by preference: the platform layer is Win32 and the tests
    # create real windows to check what Shubbak does to them.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # TreatWarningsAsErrors is already on, so this is the lint step as well.
      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The whole solution, deliberately, rather than a list of projects that can
      # drift out of date - which is the failure this workflow is here to prevent.
      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity quiet

      # Cheap check that the shipped example stays loadable, since it is what
      # everyone starts from.
      - name: Validate the example config
        run: dotnet run --project src/Shubbak.Cli --configuration Release --no-build -- check-config docs/shubbak.example.kdl

      # The README quotes a test count in two places. It has been corrected by hand
      # four times and was wrong on each of the four occasions somebody looked - the
      # last time within the same commit that added this check, because the count was
      # taken before the last test file was written. So it is checked rather than
      # remembered.
      - name: Check the README's test count
        shell: pwsh
        run: |
          # Recursive: a test in a nested folder would otherwise be invisible to the
          # very check that exists to notice drift.
          $files = Get-ChildItem -Path tests -Recurse -Filter *.cs -File |
              Where-Object { $_.FullName -notmatch '\\obj\\|\\bin\\' }

          $declared = ($files | Select-String -Pattern '^\s*\[(Fact|Theory)' -AllMatches).Count

          $claimed = (Select-String -Path README.md -Pattern '(\d+) test methods' -AllMatches).Matches |
              ForEach-Object { [int]$_.Groups[1].Value } | Sort-Object -Unique

          if ($claimed.Count -eq 0) { throw "README no longer states a test count; remove this check or restore the figure." }

          foreach ($n in $claimed) {
            if ($n -ne $declared) {
              throw "README says $n test methods; the tree declares $declared. Update README.md."
            }
          }

          Write-Output "README test count is correct: $declared"

name: package managers

# Runs when a release is published, and does the two things that depend on the
# release being public: it fills the package manifests from the assets people will
# actually download, and it tells the package managers.
#
# For Scoop, committing the filled manifest to main *is* the release - Scoop reads the
# bucket straight from this repository. For winget, the pull request against
# microsoft/winget-pkgs is opened here too, with the manifests this run has just
# committed: the first version the same way as every one after it.
#
# The hashes are recomputed from the published assets rather than copied from the
# build that made them, so what the manifests promise is what a download produces.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to publish manifests for, e.g. v0.10.0'
        required: true
        type: string

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  manifests:
    runs-on: windows-latest

    # The environment holds the winget token, and it is what makes the token
    # unreadable to any run a maintainer has not approved - a repository secret is
    # readable by any workflow on any branch, which for a repository that takes direct
    # pushes to main is anybody who can push. A separate environment from `release`,
    # so a job that needs only the bot's token is never also handed the signing
    # credentials. A release event's ref is its tag, so the environment's `v*` rule
    # admits it; a dispatch comes from main. See RELEASING.md for what is set on it.
    environment: package-managers

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}

    steps:
      # main, not the tag: the filled manifests are committed to main. The tag's
      # version must still be main's version, which is checked before anything is
      # written - if main has already moved on, this needs a human.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Check the tag against main's version
        id: version
        shell: pwsh
        run: |
          $props = [xml](Get-Content Directory.Build.props)
          $version = $props.SelectSingleNode('/Project/PropertyGroup/Version').InnerText.Trim()
          $tag = $env:TAG

          if ($tag -ne "v$version") {
            throw "The release is $tag but main is at $version. The manifests for $tag have to be filled and committed by hand: " +
                  "download the release assets into artifacts/, check out $tag, run tools/build-release.ps1 -Manifests, and commit the results."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Download the published packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --dir artifacts `
            --pattern 'shubbak-*-win-x64.msi' --pattern 'shubbak-*-win-x64.zip' `
            --pattern 'shubbak-*-win-arm64.msi' --pattern 'shubbak-*-win-arm64.zip'
          Get-ChildItem artifacts

      - name: Fill the manifests from the published packages
        shell: pwsh
        run: |
          ./tools/ensure-winget.ps1
          ./tools/build-release.ps1 -Manifests

      # A push made with the workflow's own token starts no workflow, by GitHub's rule
      # against runs that trigger themselves - so build.yml does not run on this commit.
      # It changes two manifests and nothing the build reads, which is why that is fine.
      - name: Commit the filled manifests to main
        shell: pwsh
        run: |
          Copy-Item artifacts/winget/*.yaml packaging/winget/ -Force
          Copy-Item artifacts/bucket/shubbak.json bucket/shubbak.json -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/winget bucket/shubbak.json

          if (git diff --cached --quiet) {
            Write-Output 'The manifests on main already match the release; nothing to commit.'
          }
          else {
            git commit -m "Fill the package manifests for $env:TAG" `
              -m 'Hashes and ProductCode taken from the published release assets. For Scoop this commit is the release.'
            git push origin main
          }

      # The winget-pkgs pull request, made with wingetcreate - Microsoft's tool - from
      # the manifests just committed: the complete, validated set, with the hashes of
      # the published assets. Nothing here derives a manifest from the previous
      # version, so there is no previous version to need, and the first release is
      # submitted the same way as every one after it.
      #
      # It replaced winget-releaser, a composite action that fetched its tool through
      # an unpinned action of its own. The repository refuses any action not pinned to
      # a commit, and the rule reaches through composite actions - rightly, since a
      # step that holds a token is exactly where an unpinned dependency matters - so
      # the job was refused before its first step. The tool is now a plain download at
      # a pinned version, checked against the hash Microsoft publishes for it and
      # against its Authenticode signature before it is run with the token. Bumping it
      # is the two lines of env below; the hash is the wingetcreate.exe.txt beside the
      # release asset, or (Get-FileHash wingetcreate.exe).Hash.
      #
      # The token is a classic personal access token with public_repo, which is write
      # access to every public repository of the account that issued it - far more
      # than one pull request needs - so it belongs to an account that owns nothing
      # but a fork of winget-pkgs; see RELEASING.md. wingetcreate forks, syncs and
      # opens the pull request as whichever account the token names, which is the
      # whole of the setup. Until the token exists the run stops here and says so;
      # dispatching it again with the same tag once the token is set finds nothing to
      # commit and goes straight to the submission.
      - name: Is this version already in winget-pkgs?
        id: upstream
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'

          try {
            Invoke-RestMethod -Uri "https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/m/MoaidHathot/Shubbak/$version" `
              -Headers @{ 'User-Agent' = 'shubbak-release'; 'Authorization' = "Bearer $env:GH_TOKEN" } | Out-Null
            Write-Output "MoaidHathot.Shubbak $version is already in winget-pkgs; nothing to submit."
            "exists=true" >> $env:GITHUB_OUTPUT
          }
          catch {
            "exists=false" >> $env:GITHUB_OUTPUT

            if ($env:HAS_WINGET_TOKEN -eq 'true') {
              Write-Output "MoaidHathot.Shubbak $version is not in winget-pkgs yet; the pull request will be opened."
            }
            else {
              Write-Output "MoaidHathot.Shubbak $version is not in winget-pkgs, and WINGET_TOKEN is not set on the package-managers environment, so it will not be submitted."
              Write-Output 'Set the token (see RELEASING.md) and run this workflow again with the same tag, or submit by hand as the same account:'
              Write-Output '  winget validate --manifest packaging\winget'
              Write-Output '  wingetcreate token --store'
              Write-Output '  wingetcreate submit packaging\winget'
            }
          }

      - name: Open the winget-pkgs pull request
        if: env.HAS_WINGET_TOKEN == 'true' && steps.upstream.outputs.exists != 'true'
        shell: pwsh
        env:
          # Read by wingetcreate itself, which keeps the token off the command line and
          # out of the log; its own documentation warns that --token can end up there.
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGETCREATE_VERSION: 1.12.13.0
          WINGETCREATE_SHA256: 24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri "https://github.com/microsoft/winget-create/releases/download/v$env:WINGETCREATE_VERSION/wingetcreate.exe" -OutFile $exe

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne $env:WINGETCREATE_SHA256) {
            throw "wingetcreate.exe $env:WINGETCREATE_VERSION hashes to $hash; this workflow expects $env:WINGETCREATE_SHA256. Not running it."
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '^CN=Microsoft Corporation, O=Microsoft Corporation,') {
            throw "wingetcreate.exe does not carry a valid Microsoft signature: $($signature.Status), signer '$($signature.SignerCertificate.Subject)'. Not running it."
          }

          Write-Output "wingetcreate $env:WINGETCREATE_VERSION: the hash and the signature check out."

          # --no-open: there is no browser here to open the pull request in. The title
          # is the tool's own - it says whether the package is new or an update.
          & $exe submit --no-open packaging\winget | Tee-Object -Variable output
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate submit exited $LASTEXITCODE." }

          $pullRequest = [regex]::Match(($output | Out-String), 'https://github\.com/microsoft/winget-pkgs/pull/\d+').Value
          if ($pullRequest) {
            "winget-pkgs pull request: $pullRequest" >> $env:GITHUB_STEP_SUMMARY
          }
